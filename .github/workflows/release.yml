name: release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/build_manylinux.sh && /opt/python/cp312-cp312/bin/python -m pip install build cyclonedx-bom && /opt/python/cp312-cp312/bin/python -m build -s
      - name: CycloneDX SBOM
        run: |
          /opt/python/cp312-cp312/bin/python -m venv /tmp/sbom && /tmp/sbom/bin/pip install dist/*.whl
          /opt/python/cp312-cp312/bin/python -m cyclonedx_py environment /tmp/sbom --output-format JSON -o dist/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # PyPI Trusted Publishing (OIDC) + PEP 740 attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - run: rm -f dist/sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
  sign-and-attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz
          release-signing-artifacts: true
