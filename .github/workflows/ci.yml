name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build liboqs (shared)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
          git clone --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -S /tmp/liboqs -B /tmp/liboqs/build -GNinja -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build /tmp/liboqs/build && sudo cmake --install /tmp/liboqs/build && sudo ldconfig
      - name: Compile native libraries against runner environment
        run: |
          cd src/pqblocks_core
          cp -L /usr/local/lib/liboqs.so* lib/ 2>/dev/null || cp -L /usr/local/lib64/liboqs.so* lib/ 2>/dev/null || true
          gcc -O2 -fPIC -shared -I. -I/usr/local/include -o lib/libpqblocks_errors.so pqblocks_errors.c -L/usr/local/lib -loqs -lcrypto -lssl -Wl,-rpath,'$ORIGIN'
          for m in kem sig policy; do gcc -O2 -fPIC -shared -I. -I/usr/local/include -o lib/libpqblocks_$m.so pqblocks_$m.c pqblocks_errors.c -L/usr/local/lib -loqs -lcrypto -lssl -Wl,-rpath,'$ORIGIN'; done
          cd ../..
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q
