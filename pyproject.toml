[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-core"
version = "0.1.0"
description = "Post-quantum hybrid cryptography core SDK with C shared libraries and policy enforcement."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "hybrid", "ml-kem", "ml-dsa", "c-bindings", "crypto-sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/PQBlocks/hybrid-sdk"
Documentation = "https://github.com/PQBlocks/hybrid-sdk#readme"
Source = "https://github.com/PQBlocks/hybrid-sdk"
Changelog = "https://github.com/PQBlocks/hybrid-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/hybrid-sdk/issues"
Security = "https://github.com/PQBlocks/hybrid-sdk/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pqblocks_core = ["lib/*.so*", "pqblocks", "*.c", "*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
